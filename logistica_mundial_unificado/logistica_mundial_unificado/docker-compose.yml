services:
  mysql:
    image: mysql:8.4
    container_name: logistica-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistica_mundial}
      MYSQL_USER: ${MYSQL_USER:-logistica}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-logistica_local_123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: logistica-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-logistica}
      DB_PASSWORD: ${MYSQL_PASSWORD:-logistica_local_123}
      DB_NAME: ${MYSQL_DATABASE:-logistica_mundial}
      CORS_ORIGIN: http://localhost:4200,http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: logistica-angular
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mysql_data:
