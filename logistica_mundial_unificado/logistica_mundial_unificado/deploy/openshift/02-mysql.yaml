apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: { app: logistica, component: mysql }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: logistica, component: mysql }
  template:
    metadata:
      labels: { app: logistica, component: mysql }
    spec:
      containers:
        - name: mysql
          image: registry.redhat.io/rhel9/mysql-80:latest
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: logistica-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql/data
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "MYSQL_PWD=\"$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$MYSQL_USER\" -D \"$MYSQL_DATABASE\" -e 'SELECT 1'"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: { app: logistica, component: mysql }
spec:
  selector: { app: logistica, component: mysql }
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
